name: LOOM CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: loom-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: loom

jobs:
  # ── Required gate: what a merge is judged on. Fast and deterministic. ─────────
  # typecheck + unit tests + production build. The screenshot acceptance
  # validators (validate:m*) are deliberately NOT run in CI — they're built for a
  # real GPU + manual WebGPU verification (DECISIONS.md) and are flaky on headless
  # software GL. Run them locally on real hardware: `pnpm validate:m0` … `:m6`.
  checks:
    name: typecheck · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: loom/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: loom/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: typecheck (regenerates CATALOG.md, then tsc --noEmit)
        run: pnpm typecheck
      - name: lint (Biome — errors fail, warnings are advisory)
        run: pnpm lint
      - name: unit tests
        run: pnpm test
      - name: production build (the static preview bundle)
        run: pnpm --filter @loom/engine-app exec vite build

  # The Cloudflare Pages preview job ("cloudflare preview" + the sticky LOOM
  # preview PR comment) was removed 2026-07-03: loom development moved to its
  # own fork, so previews here were pure noise on hive PRs. It lives on in the
  # forked repo; loom-preview-cleanup.yml stays to cull old preview deployments.
