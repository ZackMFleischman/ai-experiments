name: katmai deploy

# Static PWA deploy to Cloudflare Pages — production on merge to main, a preview URL
# per PR touching katmai-bears/. Same pattern as hive-deploy.yml / lex-deploy.yml, its
# own `katmai-bears` Pages project, reusing the shared CLOUDFLARE_* repo secrets. Falls
# back gracefully (with a notice) when the secrets are absent. The app is a pure video
# wall in prod — the simulated detection plumbing is behind a feature flag, off here.

on:
  pull_request:
    paths:
      - 'katmai-bears/**'
      - '.github/workflows/katmai-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'katmai-bears/**'
      - '.github/workflows/katmai-deploy.yml'
  workflow_dispatch:

concurrency:
  group: katmai-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # sticky preview comment

jobs:
  deploy:
    name: build · deploy
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: katmai-bears
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: katmai-bears/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: katmai-bears/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: build the static PWA (icons generated at prebuild)
        run: pnpm --filter @katmai/app build
      - name: deploy to Cloudflare Pages
        id: deploy
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          npm install -g wrangler@3
          # Self-provision the Pages project (ignored if it already exists).
          wrangler pages project create katmai-bears --production-branch main || true
          set +e
          branch="${GITHUB_HEAD_REF:-main}"
          out=$(wrangler pages deploy katmai-bears/packages/app/dist \
            --project-name=katmai-bears --branch="$branch" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$out"
          [ "$status" -eq 0 ] || exit "$status"
          # First pages.dev URL = the unique per-deploy subdomain (live immediately);
          # the last is the branch alias, whose DNS can lag minutes on a fresh project.
          # Smoke-check the unique URL so we don't fail on alias propagation delay.
          url=$(printf '%s\n' "$out" | grep -oiE 'https://[a-z0-9.-]+\.pages\.dev' | head -1)
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"
      - name: smoke-check the deployment
        if: steps.deploy.outcome == 'success'
        working-directory: ${{ github.workspace }}
        run: |
          url="${{ steps.deploy.outputs.deployment-url }}"
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/index.html -w '%{http_code}' "$url/") && [ "$code" = "200" ] && break
            sleep 5
          done
          [ "$code" = "200" ] || { echo "::error::deployment not serving ($code)"; exit 1; }
          grep -q 'id="root"' /tmp/index.html || { echo "::error::index.html missing app root"; exit 1; }
          for path in manifest.webmanifest icons/icon-512.png; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/$path")
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
          echo "deployment serving: index, manifest, icons all 200"
      - name: preview comment
        if: github.event_name == 'pull_request' && steps.deploy.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: katmai-preview
          message: |
            ### 🐻 Katmai Bearcam Dashboard preview

            **[▶ Open the bearcam wall](${{ steps.deploy.outputs.deployment-url }})**

            Built from `${{ github.event.pull_request.head.sha }}` — video wall of the live
            Katmai cams. Simulated bear counts/alerts/clips are behind a feature flag (off in
            prod); append `?detection=1` to any URL to try them.
      - name: notice when Cloudflare secrets are missing
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: echo "::notice::Cloudflare secrets not set — built the bundle but skipped deploy."
