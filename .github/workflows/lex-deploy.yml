name: LEX deploy

# ported from hive-deploy.yml (adapted — hot-seat job only; the Firebase
# multiplayer deploy job arrives with M4 T4.9).
# Static hot-seat PWA (T3.12): production deploy on merge to main, a preview
# URL per PR touching lex/ or parlor/. Same Cloudflare Pages pattern as
# hive-deploy.yml but its own `lex` Pages project. Falls back
# gracefully (with a notice) when the Cloudflare secrets are absent.

on:
  pull_request:
    paths: ['lex/**', 'parlor/**', '.github/workflows/lex-deploy.yml']
  push:
    branches: [main]
    paths: ['lex/**', 'parlor/**', '.github/workflows/lex-deploy.yml']
  workflow_dispatch: # manual redeploy

concurrency:
  group: lex-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # sticky preview comment

jobs:
  deploy:
    name: build · verify bundle · deploy
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: lex
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: lex/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            lex/pnpm-lock.yaml
            parlor/pnpm-lock.yaml
      # link: deps don't install the linked package's own deps — parlor first (§8.11).
      - name: install parlor (source-linked sibling workspace)
        working-directory: parlor
        run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - name: compile the dictionaries (DAWGs are generated, never committed)
        run: pnpm --filter @lex/dict build
      - name: build the static PWA (icons generated from the tile wordmark)
        run: pnpm --filter @lex/app build
      - name: verify the bundle (no firebase; dictionaries present) (T3.12)
        run: node scripts/check-bundle.mjs
      # npm -g wrangler from the repo root — same isolation reasoning as hive-deploy.
      - name: deploy to Cloudflare Pages
        id: deploy
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          npm install -g wrangler@3
          # Self-provision the Pages project (ignored if it already exists).
          wrangler pages project create lex --production-branch main || true
          set +e
          branch="${GITHUB_HEAD_REF:-main}"
          out=$(wrangler pages deploy lex/packages/app/dist \
            --project-name=lex --branch="$branch" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$out"
          [ "$status" -eq 0 ] || exit "$status"
          # First URL = the unique deployment; last = the branch alias. The
          # alias hostname can lag DNS by minutes on a fresh project, so the
          # smoke check probes the deployment URL and the preview comment
          # links the alias (falling back to the deployment URL).
          urls=$(printf '%s\n' "$out" | grep -oiE 'https://[a-z0-9.-]+\.pages\.dev')
          echo "deployment-url=$(printf '%s\n' "$urls" | head -1)" >> "$GITHUB_OUTPUT"
          echo "alias-url=$(printf '%s\n' "$urls" | tail -1)" >> "$GITHUB_OUTPUT"
      - name: smoke-check the deployment
        if: steps.deploy.outcome == 'success'
        working-directory: ${{ github.workspace }}
        run: |
          url="${{ steps.deploy.outputs.deployment-url }}"
          # Fresh *.pages.dev hostnames can take a few minutes on first deploy.
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/index.html -w '%{http_code}' "$url/") && [ "$code" = "200" ] && break
            sleep 10
          done
          [ "$code" = "200" ] || { echo "::error::deployment not serving ($code)"; exit 1; }
          grep -q 'id="root"' /tmp/index.html || { echo "::error::index.html missing app root"; exit 1; }
          for path in manifest.webmanifest icons/icon-512.png dict/2of12inf.dawg game/local; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/$path")
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
          echo "deployment serving: index, manifest, icons, dictionary, SPA fallback all 200"
      - name: preview comment
        if: github.event_name == 'pull_request' && steps.deploy.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lex-preview
          message: |
            ### 🅛 LEX preview

            **[▶ Open the hot-seat game](${{ steps.deploy.outputs.alias-url || steps.deploy.outputs.deployment-url }}/game/local)**

            Built from `${{ github.event.pull_request.head.sha }}` — static PWA, LocalTransport only.
      - name: notice when Cloudflare secrets are missing
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: echo "::notice::Cloudflare secrets not set — built and verified the bundle but skipped deploy."

  # Production Firebase deploy (M4 T4.9): the multiplayer app to Hosting, the
  # callables to Functions, rules + indexes to Firestore — main merges only.
  # Ported from hive-deploy.yml; auth via the service-account JSON secret
  # (DECISIONS 2026-07-04 — lex-zmf setup complete, secret
  # FIREBASE_SERVICE_ACCOUNT_LEX_ZMF).
  firebase:
    name: firebase deploy (hosting · functions · firestore)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEX_ZMF }}
    defaults:
      run:
        working-directory: lex
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: lex/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            lex/pnpm-lock.yaml
            parlor/pnpm-lock.yaml
      # link: deps don't install the linked package's own deps — parlor first (§8.11).
      - name: install parlor (source-linked sibling workspace)
        working-directory: parlor
        run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - name: compile the dictionaries (DAWGs are generated, never committed)
        run: pnpm --filter @lex/dict build
      - name: build the multiplayer app + functions (bundle + dawgs beside it)
        run: |
          pnpm --filter @lex/app build:mp
          pnpm --filter @lex/functions build
      # Cloud Build npm-installs the packed functions dir including
      # devDependencies — the link:/workspace dev-only deps (inlined into
      # lib/ by esbuild) would fail it. The cloud needs runtime deps only.
      - name: strip devDependencies from the packed functions package
        run: cd packages/functions && npm pkg delete devDependencies
      - name: rules parity (re-check at deploy time — a post-lint edit of the rules copy must not ship unchecked)
        run: node scripts/check-rules-parity.mjs
      - name: firebase deploy
        if: env.FIREBASE_SA != ''
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          # First-run bootstrap: the CLI queries the Cloud Billing API when
          # deploying v2 functions but never auto-enables it (it auto-enables
          # the rest). Idempotent, so it just runs every time.
          gcloud auth login --brief --quiet --cred-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud services enable cloudbilling.googleapis.com --project lex-zmf
          # Deploy EVERY function, every time. The CLI's default is to skip
          # functions whose uploaded source is unchanged — which sounds like a
          # pure speed win and is actually a correctness hole: a function that
          # FAILS to deploy is never retried, because the source it failed on
          # never changes again. That is exactly how a pre-M7 `createGame`
          # stayed live for a day behind an M7 client, rejecting every 3-4
          # player game while the next two deploys reported success and logged
          # "createGame ... Skipped (No changes detected)".
          export FIREBASE_SKIP_UNCHANGED_FUNCTIONS=false
          set -o pipefail
          pnpm exec firebase deploy --project prod --only hosting,functions,firestore --non-interactive --force \
            2>&1 | tee "$RUNNER_TEMP/deploy.log"
          # Belt and braces: if the CLI ever skips one anyway (a default
          # change, an env var that stops being honoured), say so loudly
          # instead of shipping a half-updated backend.
          if grep -q 'Skipped (No changes detected)' "$RUNNER_TEMP/deploy.log"; then
            echo "::error::a function was skipped rather than deployed — the live backend may not match this commit"
            exit 1
          fi
          # Functions first created during a failed deploy never get their
          # invoker IAM binding, and the CLI never retries it on updates — the
          # callables then 403 at the Cloud Run layer ("internal" in the app).
          # Repair idempotently on every deploy: callables (DESIGN §6.3) are
          # publicly invokable; forfeitExpired stays private to the Cloud
          # Scheduler OIDC identity (the default compute SA). Requires
          # roles/run.admin on the deploy SA (§8.5).
          repair_failed=0
          for f in creategame joingame cancelgame challengeuser respondchallenge submitmove resign rematch ping; do
            gcloud run services add-iam-policy-binding "$f" --project lex-zmf \
              --region us-central1 --member allUsers --role roles/run.invoker --quiet \
              || repair_failed=1
          done
          gcloud run services add-iam-policy-binding forfeitexpired --project lex-zmf \
            --region us-central1 --role roles/run.invoker --quiet \
            --member "serviceAccount:$(gcloud projects describe lex-zmf --format='value(projectNumber)')-compute@developer.gserviceaccount.com" \
            || repair_failed=1
          rm -f "$RUNNER_TEMP/firebase-sa.json"
          if [ "$repair_failed" = "1" ]; then
            echo "::error::invoker IAM repair failed — grant roles/run.admin to the lex-zmf deploy service account and re-run this workflow"
            exit 1
          fi
      - name: smoke-check hosting
        if: env.FIREBASE_SA != ''
        run: |
          url="https://lex-zmf.web.app"
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/index.html -w '%{http_code}' "$url/") && [ "$code" = "200" ] && break
            sleep 5
          done
          [ "$code" = "200" ] || { echo "::error::hosting not serving ($code)"; exit 1; }
          grep -q 'id="root"' /tmp/index.html || { echo "::error::index.html missing app root"; exit 1; }
          for path in lobby dict/2of12inf.dawg; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/$path")
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
          echo "hosting serving: index, SPA fallback, dictionary all 200"
      - name: smoke-check the callables are actually live
        if: env.FIREBASE_SA != ''
        run: |
          # Hosting serving 200 says NOTHING about the backend: the callables
          # are separate Cloud Run services, and a half-applied functions
          # deploy leaves hosting new while a callable stays stale or missing.
          # Probe each unauthenticated — the callable framework answers 401
          # UNAUTHENTICATED before it looks at any argument, so 401 proves the
          # function exists, is invokable (not 403, i.e. the IAM binding above
          # held) and is running. 404 means it never deployed at all.
          base="https://us-central1-lex-zmf.cloudfunctions.net"
          failed=0
          for f in createGame joinGame startGame setTurnOrder invitePlayers respondInvite leaveGame submitMove; do
            code=$(curl -s -o /tmp/probe.json -w '%{http_code}' -X POST "$base/$f" \
              -H 'Content-Type: application/json' -d '{"data":{}}')
            case "$code" in
              401) ;;
              403) echo "::error::$f is deployed but not publicly invokable (403) — invoker IAM binding missing"; failed=1 ;;
              404) echo "::error::$f is NOT deployed (404)"; failed=1 ;;
              *) echo "::error::$f answered $code, expected 401 (body: $(head -c 200 /tmp/probe.json))"; failed=1 ;;
            esac
          done
          [ "$failed" = "0" ] || exit 1
          echo "callables live: every probed function answered 401 (deployed, invokable, running)"
      - name: notice when the Firebase service-account secret is missing
        if: env.FIREBASE_SA == ''
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT_LEX_ZMF not set — built but skipped the Firebase deploy."
