name: LEX deploy

# ported from hive-deploy.yml (adapted — hot-seat job only; the Firebase
# multiplayer deploy job arrives with M4 T4.9).
# Static hot-seat PWA (T3.12): production deploy on merge to main, a preview
# URL per PR touching lex/ or parlor/. Same Cloudflare Pages pattern as
# loom-ci.yml / hive-deploy.yml but its own `lex` Pages project. Falls back
# gracefully (with a notice) when the Cloudflare secrets are absent.

on:
  pull_request:
    paths: ['lex/**', 'parlor/**', '.github/workflows/lex-deploy.yml']
  push:
    branches: [main]
    paths: ['lex/**', 'parlor/**', '.github/workflows/lex-deploy.yml']
  workflow_dispatch: # manual redeploy

concurrency:
  group: lex-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # sticky preview comment

jobs:
  deploy:
    name: build · verify bundle · deploy
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: lex
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: lex/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            lex/pnpm-lock.yaml
            parlor/pnpm-lock.yaml
      # link: deps don't install the linked package's own deps — parlor first (§8.11).
      - name: install parlor (source-linked sibling workspace)
        working-directory: parlor
        run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - name: compile the dictionaries (DAWGs are generated, never committed)
        run: pnpm --filter @lex/dict build
      - name: build the static PWA (icons generated from the tile wordmark)
        run: pnpm --filter @lex/app build
      - name: verify the bundle (no firebase; dictionaries present) (T3.12)
        run: node scripts/check-bundle.mjs
      # npm -g wrangler from the repo root — same isolation reasoning as loom-ci.
      - name: deploy to Cloudflare Pages
        id: deploy
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          npm install -g wrangler@3
          # Self-provision the Pages project (ignored if it already exists).
          wrangler pages project create lex --production-branch main || true
          set +e
          branch="${GITHUB_HEAD_REF:-main}"
          out=$(wrangler pages deploy lex/packages/app/dist \
            --project-name=lex --branch="$branch" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$out"
          [ "$status" -eq 0 ] || exit "$status"
          url=$(printf '%s\n' "$out" | grep -oiE 'https://[a-z0-9.-]+\.pages\.dev' | tail -1)
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"
      - name: smoke-check the deployment
        if: steps.deploy.outcome == 'success'
        working-directory: ${{ github.workspace }}
        run: |
          url="${{ steps.deploy.outputs.deployment-url }}"
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/index.html -w '%{http_code}' "$url/") && [ "$code" = "200" ] && break
            sleep 5
          done
          [ "$code" = "200" ] || { echo "::error::deployment not serving ($code)"; exit 1; }
          grep -q 'id="root"' /tmp/index.html || { echo "::error::index.html missing app root"; exit 1; }
          for path in manifest.webmanifest icons/icon-512.png dict/2of12inf.dawg game/local; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/$path")
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
          echo "deployment serving: index, manifest, icons, dictionary, SPA fallback all 200"
      - name: preview comment
        if: github.event_name == 'pull_request' && steps.deploy.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lex-preview
          message: |
            ### 🅛 LEX preview

            **[▶ Open the hot-seat game](${{ steps.deploy.outputs.deployment-url }}/game/local)**

            Built from `${{ github.event.pull_request.head.sha }}` — static PWA, LocalTransport only.
      - name: notice when Cloudflare secrets are missing
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: echo "::notice::Cloudflare secrets not set — built and verified the bundle but skipped deploy."
