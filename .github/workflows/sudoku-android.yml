# The store pipeline's CI half (BRAND-IMPLEMENTATION.md 3b): every change to
# sudoku or the native glue proves the Android release bundle still builds,
# and main uploads the unsigned AAB as an artifact. Signing + Play upload are
# owner steps (GAME-SETUP.md native track ⚑); iOS archives ship from the
# owner's Mac — no macOS CI until cadence demands it (strategy §1.0).
name: SUDOKU android

on:
  pull_request:
    paths:
      [
        'sudoku/**',
        'parlor/packages/native/**',
        'parlor/packages/brand/**',
        '.github/workflows/sudoku-android.yml',
      ]
  push:
    branches: [main]
    paths:
      [
        'sudoku/**',
        'parlor/packages/native/**',
        'parlor/packages/brand/**',
        '.github/workflows/sudoku-android.yml',
      ]
  workflow_dispatch: # manual rebuild (e.g. before a Play upload)

concurrency:
  group: sudoku-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  aab:
    name: android · unsigned release AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sudoku
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sudoku/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            sudoku/pnpm-lock.yaml
            parlor/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: install parlor (source-linked sibling — must install first)
        run: pnpm install --frozen-lockfile
        working-directory: parlor
      - run: pnpm install --frozen-lockfile
      - name: build the web bundle the shell wraps (includes bundle check)
        run: pnpm build
      - name: sync web assets + plugins into the committed shell
        working-directory: sudoku/packages/app
        run: pnpm exec cap sync android
      - name: build the release AAB (unsigned — signing is an owner step)
        working-directory: sudoku/native/android
        run: ./gradlew bundleRelease --no-daemon
      - name: upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-release-aab
          path: sudoku/native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
