<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LOOM — Staged</title>
    <style>
      :root {
        --bg: #0b0c10;
        --panel: #14161c;
        --edge: #262a33;
        --text: #c8cdd8;
        --dim: #6b7280;
        --accent: #3ddc97;
        --warn: #f3c969;
        --danger: #e6455a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 system-ui, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 8px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--edge);
        flex: 0 0 auto;
      }
      header .spacer { flex: 1; }
      .dimlabel { color: var(--dim); font-size: 12px; }
      button {
        background: #1d212b;
        color: var(--text);
        border: 1px solid var(--edge);
        border-radius: 6px;
        padding: 6px 14px;
        font: inherit;
        cursor: pointer;
      }
      button:hover { border-color: var(--dim); }
      button:disabled { opacity: 0.35; cursor: default; }
      #commit {
        background: #11261d;
        border-color: var(--accent);
        color: var(--accent);
        font-weight: 700;
        font-size: 16px;
        padding: 8px 22px;
      }
      #view {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      #preview {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: none;
      }
      body.hasstaged #preview { display: block; }
      #empty { color: var(--dim); }
      body.hasstaged #empty { display: none; }
      #disconnected {
        position: fixed;
        inset: auto 0 0 0;
        padding: 10px;
        text-align: center;
        background: var(--danger);
        color: #fff;
        display: none;
      }
      body.disconnected #disconnected { display: block; }
    </style>
  </head>
  <body>
    <header>
      <span class="dimlabel">STAGED</span> <b id="stagedname">—</b>
      <span id="fadeinfo" class="dimlabel"></span>
      <span class="spacer"></span>
      <button id="unstage" disabled>unstage</button>
      <button id="commit" disabled>COMMIT</button>
    </header>
    <div id="view">
      <img id="preview" alt="" />
      <div id="empty">nothing staged — stage an instance from the Console</div>
    </div>
    <div id="disconnected">engine not found — is the Output window (<code>/</code>) open?</div>
    <script type="module" src="/src/staged.ts"></script>
  </body>
</html>
