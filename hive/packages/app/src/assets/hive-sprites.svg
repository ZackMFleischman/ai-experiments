<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- One asset source of truth (DESIGN §6.4). T6.1 glyph set: flat single-color
       marks, 100x100 grid, stroke=currentColor, consistent 6px weight, readable
       at 40px. Tile bases tint via the CSS var - -hive-tile. -->

  <symbol id="hex-base" viewBox="0 0 100 100">
    <polygon
      points="50,2 91.6,26 91.6,74 50,98 8.4,74 8.4,26"
      fill="var(--hive-tile, #f3e9d2)"
      stroke="var(--hive-tile-edge, #00000033)"
      stroke-width="3"
      stroke-linejoin="round"
    />
  </symbol>

  <symbol id="hex-ghost" viewBox="0 0 100 100">
    <polygon
      points="50,4 89.9,27 89.9,73 50,96 10.1,73 10.1,27"
      fill="var(--hive-ghost-fill, transparent)"
      stroke="currentColor"
      stroke-width="4"
      stroke-dasharray="9 7"
      stroke-linejoin="round"
    />
  </symbol>

  <symbol id="bug-queen" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- crown -->
      <path d="M36 22 L40 10 L47 19 L50 6 L53 19 L60 10 L64 22 Z" fill="currentColor" stroke-width="3" />
      <!-- head + thorax -->
      <circle cx="50" cy="33" r="9" />
      <!-- wings -->
      <path d="M40 50 C22 42 16 52 30 62" />
      <path d="M60 50 C78 42 84 52 70 62" />
      <!-- striped abdomen -->
      <path d="M50 44 C62 44 68 54 68 65 C68 79 60 90 50 90 C40 90 32 79 32 65 C32 54 38 44 50 44 Z" />
      <path d="M33 58 L67 58 M32 70 L68 70 M37 81 L63 81" stroke-width="5" />
    </g>
  </symbol>

  <symbol id="bug-ant" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="50" cy="24" r="10" />
      <ellipse cx="50" cy="48" rx="8" ry="10" />
      <ellipse cx="50" cy="76" rx="13" ry="15" />
      <!-- jointed legs -->
      <path d="M43 42 L28 32 L20 20 M42 51 L24 51 L14 46 M44 60 L30 68 L26 80" />
      <path d="M57 42 L72 32 L80 20 M58 51 L76 51 L86 46 M56 60 L70 68 L74 80" />
      <!-- curled antennae -->
      <path d="M44 16 C40 8 34 6 30 10 M56 16 C60 8 66 6 70 10" />
    </g>
  </symbol>

  <symbol id="bug-spider" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="50" cy="40" r="10" />
      <ellipse cx="50" cy="66" rx="13" ry="16" />
      <!-- four jointed legs per side -->
      <path d="M41 34 L28 20 L24 10 M40 44 L20 36 L10 36 M41 54 L22 56 L12 64 M45 62 L32 74 L30 86" />
      <path d="M59 34 L72 20 L76 10 M60 44 L80 36 L90 36 M59 54 L78 56 L88 64 M55 62 L68 74 L70 86" />
    </g>
  </symbol>

  <symbol id="bug-grasshopper" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- angled body, mid-leap -->
      <ellipse cx="48" cy="48" rx="13" ry="28" transform="rotate(14 48 48)" />
      <circle cx="41" cy="15" r="8" />
      <path d="M37 8 L30 2 M47 9 L52 2" stroke-width="4" />
      <!-- the big jumping leg -->
      <path d="M58 36 L84 44 L78 70 L88 88" />
      <!-- front legs -->
      <path d="M36 42 L22 50 L18 60 M38 56 L26 68 L26 78" />
    </g>
  </symbol>

  <symbol id="bug-beetle" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- split elytra -->
      <path d="M50 34 C66 34 72 46 72 60 C72 76 62 88 50 88 C38 88 28 76 28 60 C28 46 34 34 50 34 Z" />
      <path d="M50 36 L50 86" stroke-width="5" />
      <!-- leg stubs -->
      <path d="M29 50 L16 44 M27 64 L14 64 M32 76 L20 84" stroke-width="5" />
      <path d="M71 50 L84 44 M73 64 L86 64 M68 76 L80 84" stroke-width="5" />
      <!-- head + pincers -->
      <circle cx="50" cy="23" r="8" />
      <path d="M44 16 C38 6 30 4 26 8 M56 16 C62 6 70 4 74 8" stroke-width="5" />
    </g>
  </symbol>

  <symbol id="bug-mosquito" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <!-- proboscis -->
      <path d="M50 26 L50 6" />
      <circle cx="50" cy="33" r="7" />
      <!-- slim body -->
      <path d="M50 40 L50 66 M47 66 C47 76 50 84 50 84 C50 84 53 76 53 66 Z" stroke-width="6" />
      <!-- swept wings -->
      <ellipse cx="32" cy="56" rx="8" ry="21" transform="rotate(26 32 56)" />
      <ellipse cx="68" cy="56" rx="8" ry="21" transform="rotate(-26 68 56)" />
      <!-- trailing legs -->
      <path d="M45 44 L30 34 M55 44 L70 34" stroke-width="4" />
    </g>
  </symbol>

  <symbol id="bug-ladybug" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round">
      <circle cx="50" cy="58" r="26" />
      <path d="M50 32 L50 84" stroke-width="5" />
      <path d="M40 26 C42 20 46 17 50 17 C54 17 58 20 60 26" />
      <path d="M44 18 L38 8 M56 18 L62 8" stroke-width="4" />
      <circle cx="38" cy="50" r="4.5" fill="currentColor" stroke="none" />
      <circle cx="62" cy="50" r="4.5" fill="currentColor" stroke="none" />
      <circle cx="36" cy="66" r="4.5" fill="currentColor" stroke="none" />
      <circle cx="64" cy="66" r="4.5" fill="currentColor" stroke="none" />
      <circle cx="50" cy="72" r="4.5" fill="currentColor" stroke="none" />
    </g>
  </symbol>

  <symbol id="bug-pillbug" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- segmented dome -->
      <path d="M22 68 A28 28 0 1 1 78 68 Z" />
      <path d="M26 46 L74 46 M23 57 L77 57" stroke-width="5" />
      <!-- little legs under the shell -->
      <path d="M30 68 L28 80 M40 68 L39 82 M50 68 L50 83 M60 68 L61 82 M70 68 L72 80" stroke-width="4" />
      <!-- antennae -->
      <path d="M36 30 L28 20 M64 30 L72 20" stroke-width="4" />
    </g>
  </symbol>

  <symbol id="motif-crown" viewBox="0 0 100 100">
    <path
      d="M18 70 L14 34 L34 50 L50 26 L66 50 L86 34 L82 70 Z"
      fill="currentColor"
      stroke="currentColor"
      stroke-width="4"
      stroke-linejoin="round"
    />
  </symbol>

  <symbol id="motif-tile" viewBox="0 0 100 100">
    <polygon
      points="50,8 86.4,29 86.4,71 50,92 13.6,71 13.6,29"
      fill="none"
      stroke="currentColor"
      stroke-width="5"
      stroke-linejoin="round"
    />
    <circle cx="50" cy="50" r="14" fill="currentColor" />
  </symbol>
</svg>
