<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- One asset source of truth (DESIGN §6.4). Draft circle/arc glyphs (M3); the
       real art pass is T6.1. Every glyph: 100x100 grid, stroke=currentColor,
       readable at 40px. Tile bases tint via the CSS var - -hive-tile. -->

  <symbol id="hex-base" viewBox="0 0 100 100">
    <polygon
      points="50,2 91.6,26 91.6,74 50,98 8.4,74 8.4,26"
      fill="var(--hive-tile, #f3e9d2)"
      stroke="var(--hive-tile-edge, #00000033)"
      stroke-width="3"
      stroke-linejoin="round"
    />
  </symbol>

  <symbol id="hex-ghost" viewBox="0 0 100 100">
    <polygon
      points="50,4 89.9,27 89.9,73 50,96 10.1,73 10.1,27"
      fill="var(--hive-ghost-fill, transparent)"
      stroke="currentColor"
      stroke-width="4"
      stroke-dasharray="9 7"
      stroke-linejoin="round"
    />
  </symbol>

  <symbol id="bug-queen" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="50" cy="62" rx="17" ry="20" />
      <circle cx="50" cy="34" r="11" />
      <path d="M35 28 L39 14 L47 24 L50 10 L53 24 L61 14 L65 28" fill="currentColor" stroke-width="4" />
    </g>
  </symbol>

  <symbol id="bug-ant" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round">
      <circle cx="50" cy="26" r="10" />
      <circle cx="50" cy="50" r="9" />
      <ellipse cx="50" cy="76" rx="12" ry="14" />
      <path d="M42 44 L24 34 M42 54 L24 56 M44 64 L28 76" />
      <path d="M58 44 L76 34 M58 54 L76 56 M56 64 L72 76" />
      <path d="M44 18 L38 8 M56 18 L62 8" />
    </g>
  </symbol>

  <symbol id="bug-spider" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round">
      <circle cx="50" cy="42" r="11" />
      <ellipse cx="50" cy="68" rx="14" ry="16" />
      <path d="M40 36 L18 24 M40 46 L14 44 M42 56 L18 64 M46 62 L28 84" />
      <path d="M60 36 L82 24 M60 46 L86 44 M58 56 L82 64 M54 62 L72 84" />
    </g>
  </symbol>

  <symbol id="bug-grasshopper" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="46" cy="50" rx="14" ry="30" />
      <circle cx="46" cy="14" r="8" />
      <path d="M58 34 C82 40 84 62 66 82 L60 66" />
      <path d="M34 40 L20 50 M34 56 L20 66" />
    </g>
  </symbol>

  <symbol id="bug-beetle" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round">
      <ellipse cx="50" cy="58" rx="20" ry="26" />
      <path d="M50 34 L50 84" />
      <circle cx="50" cy="24" r="9" />
      <path d="M43 17 C34 8 30 8 26 12 M57 17 C66 8 70 8 74 12" />
    </g>
  </symbol>

  <symbol id="bug-mosquito" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
      <circle cx="50" cy="30" r="7" />
      <path d="M50 37 L50 74" stroke-width="7" />
      <ellipse cx="33" cy="55" rx="9" ry="22" transform="rotate(20 33 55)" />
      <ellipse cx="67" cy="55" rx="9" ry="22" transform="rotate(-20 67 55)" />
      <path d="M50 23 L50 10" />
    </g>
  </symbol>

  <symbol id="bug-ladybug" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6">
      <circle cx="50" cy="56" r="26" />
      <path d="M50 30 L50 82" />
      <circle cx="50" cy="22" r="8" />
      <circle cx="39" cy="48" r="4" fill="currentColor" stroke="none" />
      <circle cx="61" cy="48" r="4" fill="currentColor" stroke="none" />
      <circle cx="38" cy="66" r="4" fill="currentColor" stroke="none" />
      <circle cx="62" cy="66" r="4" fill="currentColor" stroke="none" />
    </g>
  </symbol>

  <symbol id="bug-pillbug" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round">
      <path d="M26 66 A28 28 0 1 1 74 66" />
      <path d="M30 44 L70 44 M28 56 L72 56 M32 68 L68 68" />
      <circle cx="50" cy="26" r="6" fill="currentColor" stroke="none" />
      <path d="M26 66 L20 78 M74 66 L80 78" />
    </g>
  </symbol>

  <symbol id="motif-crown" viewBox="0 0 100 100">
    <path
      d="M18 70 L14 34 L34 50 L50 26 L66 50 L86 34 L82 70 Z"
      fill="currentColor"
      stroke="currentColor"
      stroke-width="4"
      stroke-linejoin="round"
    />
  </symbol>

  <symbol id="motif-tile" viewBox="0 0 100 100">
    <polygon
      points="50,8 86.4,29 86.4,71 50,92 13.6,71 13.6,29"
      fill="none"
      stroke="currentColor"
      stroke-width="5"
      stroke-linejoin="round"
    />
    <circle cx="50" cy="50" r="14" fill="currentColor" />
  </symbol>
</svg>
