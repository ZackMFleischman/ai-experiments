<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- One asset source of truth (DESIGN §6.4). Solid-silhouette glyph set: single
       currentColor marks on a 100x100 grid; body = overlapping filled lobes,
       appendages rooted inside the fill, internal detail (stripes, spots, splits,
       muzzles) via evenodd knockouts that reveal the tile. Readable at 40px.
       Tile bases tint via the CSS var --hive-tile. -->

  <symbol id="hex-base" viewBox="0 0 100 100">
    <polygon
      points="50,2 91.6,26 91.6,74 50,98 8.4,74 8.4,26"
      fill="var(--hive-tile, #f3e9d2)"
      stroke="var(--hive-tile-edge, #00000033)"
      stroke-width="3"
      stroke-linejoin="round"
    />
  </symbol>

  <symbol id="hex-ghost" viewBox="0 0 100 100">
    <polygon
      points="50,4 89.9,27 89.9,73 50,96 10.1,73 10.1,27"
      fill="var(--hive-ghost-fill, transparent)"
      stroke="currentColor"
      stroke-width="4"
      stroke-dasharray="9 7"
      stroke-linejoin="round"
    />
  </symbol>

  <!-- Bug glyph set: eight solid silhouettes, one insect per Hive piece. -->

  <symbol id="bug-queen" viewBox="0 0 100 100">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <!-- slim wings sweeping back from the thorax -->
  <ellipse cx="33" cy="52" rx="6.5" ry="15" transform="rotate(28 33 52)"/>
  <ellipse cx="67" cy="52" rx="6.5" ry="15" transform="rotate(-28 67 52)"/>
  <!-- legs -->
  <g fill="none" stroke-width="4"><path d="M46 56 L36 64 M54 56 L64 64"/></g>
  <!-- crown (queen identity marker) -->
  <path d="M38 20 L42 9 L47 16 L50 6 L53 16 L58 9 L62 20 Z" stroke-width="2"/>
  <!-- head + thorax -->
  <circle cx="50" cy="30" r="8.5"/>
  <ellipse cx="50" cy="45" rx="8.5" ry="9"/>
  <!-- striped abdomen: teardrop with knockout stripes (tile shows through) -->
  <path fill-rule="evenodd" d="
    M50 51 C62 51 68 61 68 71 C68 83 60 91 50 91 C40 91 32 83 32 71 C32 61 38 51 50 51 Z
    M35 64 L65 64 L65 60 L35 60 Z
    M33 74 L67 74 L67 70 L33 70 Z
    M38 83 L62 83 L62 79 L38 79 Z"/>
</g>
  </symbol>

  <symbol id="bug-ant" viewBox="0 0 100 100">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <g fill="none" stroke-width="5">
    <path d="M50 50 L30 34 L20 22 M50 52 L26 50 L14 46 M50 56 L30 66 L24 80"/>
    <path d="M50 50 L70 34 L80 22 M50 52 L74 50 L86 46 M50 56 L70 66 L76 80"/>
  </g>
  <g fill="none" stroke-width="4"><path d="M46 22 C41 10 34 8 30 12 M54 22 C59 10 66 8 70 12"/></g>
  <circle cx="50" cy="24" r="11"/>
  <ellipse cx="50" cy="47" rx="9.5" ry="12"/>
  <ellipse cx="50" cy="74" rx="15" ry="17"/>
</g>
  </symbol>

  <symbol id="bug-spider" viewBox="0 0 100 100">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <!-- 8 bent legs, all rooted inside the cephalothorax -->
  <g fill="none" stroke-width="4.5">
    <path d="M45 44 L26 30 L20 18 M44 50 L22 44 L12 42 M44 56 L22 60 L12 68 M46 62 L30 74 L28 88"/>
    <path d="M55 44 L74 30 L80 18 M56 50 L78 44 L88 42 M56 56 L78 60 L88 68 M54 62 L70 74 L72 88"/>
  </g>
  <circle cx="50" cy="42" r="11"/>
  <ellipse cx="50" cy="66" rx="14" ry="17"/>
</g>
  </symbol>

  <symbol id="bug-grasshopper" viewBox="0 0 100 100">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <!-- antennae -->
  <g fill="none" stroke-width="3.5"><path d="M43 24 L37 11 M52 23 L58 11"/></g>
  <!-- front + mid legs, rooted in body -->
  <g fill="none" stroke-width="4"><path d="M46 58 L34 66 L29 77 M47 49 L34 51 L27 47"/></g>
  <!-- iconic hind leg: ONE connected bent limb (femur up, tibia down) -->
  <path fill="none" stroke-width="7" d="M50 56 L73 43 L67 71 L81 84"/>
  <!-- knee accent so the joint reads solid -->
  <circle cx="73" cy="43" r="4.5"/>
  <!-- head + upright body -->
  <circle cx="47" cy="24" r="8"/>
  <ellipse cx="49" cy="53" rx="12" ry="22"/>
</g>
  </symbol>

  <symbol id="bug-beetle" viewBox="0 0 100 100">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <g fill="none" stroke-width="5">
    <path d="M32 50 L16 42 M30 64 L14 64 M34 78 L20 86"/>
    <path d="M68 50 L84 42 M70 64 L86 64 M66 78 L80 86"/>
  </g>
  <g fill="none" stroke-width="4"><path d="M45 18 C39 8 31 6 27 10 M55 18 C61 8 69 6 73 10"/></g>
  <circle cx="50" cy="24" r="8.5"/>
  <!-- domed elytra with a knockout centre split -->
  <path fill-rule="evenodd" d="
    M50 32 C67 32 74 46 74 60 C74 77 63 90 50 90 C37 90 26 77 26 60 C26 46 33 32 50 32 Z
    M48.5 40 L51.5 40 L51.5 84 L48.5 84 Z"/>
</g>
  </symbol>

  <symbol id="bug-mosquito" viewBox="0 0 100 100">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <!-- long dangly legs rooted in the body -->
  <g fill="none" stroke-width="3">
    <path d="M48 52 L34 44 L24 48 M48 60 L30 60 L20 68 M49 67 L36 78 L34 89"/>
    <path d="M52 52 L66 44 L76 48 M52 60 L70 60 L80 68 M51 67 L64 78 L66 89"/>
  </g>
  <!-- slim outlined wings (delicate, not moth-like) -->
  <g fill="none" stroke-width="3">
    <ellipse cx="33" cy="52" rx="5.5" ry="18" transform="rotate(32 33 52)"/>
    <ellipse cx="67" cy="52" rx="5.5" ry="18" transform="rotate(-32 67 52)"/>
  </g>
  <!-- long proboscis rooted in head -->
  <path fill="none" stroke-width="3.5" d="M50 30 L50 9"/>
  <circle cx="50" cy="33" r="6.5"/>
  <ellipse cx="50" cy="58" rx="5.5" ry="19"/>
</g>
  </symbol>

  <symbol id="bug-ladybug" viewBox="0 0 100 100">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <g fill="none" stroke-width="4.5">
    <path d="M30 50 L18 42 M28 62 L14 62 M32 74 L20 84"/>
    <path d="M70 50 L82 42 M72 62 L86 62 M68 74 L80 84"/>
  </g>
  <g fill="none" stroke-width="3.5"><path d="M44 20 L37 9 M56 20 L63 9"/></g>
  <circle cx="50" cy="22" r="9"/>
  <!-- round body: centre split + spots knocked out (tile shows through) -->
  <path fill-rule="evenodd" d="
    M50 30 A28 28 0 1 1 49.99 30 Z
    M48.5 36 L51.5 36 L51.5 84 L48.5 84 Z
    M38 48 m-4 0 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0
    M62 48 m-4 0 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0
    M36 66 m-4 0 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0
    M64 66 m-4 0 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0"/>
</g>
  </symbol>

  <symbol id="bug-pillbug" viewBox="0 0 100 100">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <!-- short antennae -->
  <g fill="none" stroke-width="3.5"><path d="M43 30 L38 21 M57 30 L62 21"/></g>
  <!-- little legs peeking from under the armor -->
  <g fill="none" stroke-width="3"><path d="M31 50 L24 51 M31 60 L23 63 M32 70 L26 75 M69 50 L76 51 M69 60 L77 63 M68 70 L74 75"/></g>
  <!-- segmented roly-poly body: rounded oval with knockout seams (armadillo armor) -->
  <path fill-rule="evenodd" d="
    M50 26 C63 26 71 38 71 54 C71 71 62 82 50 82 C38 82 29 71 29 54 C29 38 37 26 50 26 Z
    M33 44 L67 44 L67 40.5 L33 40.5 Z
    M30 55 L70 55 L70 51.5 L30 51.5 Z
    M33 66 L67 66 L67 62.5 L33 62.5 Z"/>
</g>
  </symbol>

  <!-- Bear-mode glyph set (Settings reskin): same silhouette system, one bear
       species per piece, resolved per-render by board/pieceArt.tsx. Each is a
       bust with one species mark: crown (brown/queen), long clean face (polar),
       eye rings (spectacled), chest blaze + tongue (sun), branch pose (black),
       big ears + chest V (moon), inverted patches (panda), shaggy jaw + claws
       (sloth). -->

  <symbol id="bear-queen" viewBox="0 0 100 100">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <path d="M38 17 L42 6 L47.5 13 L50 3 L52.5 13 L57 6 L61 17 Z" stroke-width="2"/>
  <circle cx="30" cy="40" r="9"/>
  <circle cx="70" cy="40" r="9"/>
  <path fill-rule="evenodd" d="
    M50 33 A19 19 0 1 1 49.99 33 Z
    M43 49 a2.6 2.6 0 1 0 0.01 0 Z
    M57 49 a2.6 2.6 0 1 0 0.01 0 Z
    M42 62 a8 6.5 0 1 0 16 0 a8 6.5 0 1 0 -16 0"/>
  <ellipse cx="50" cy="59" rx="3.4" ry="2.6"/>
  <path d="M22 94 C26 80 36 74 50 74 C64 74 74 80 78 94 Z"/>
</g>
  </symbol>

  <symbol id="bear-ant" viewBox="0 0 100 100">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="34" cy="26" r="6.5"/>
  <circle cx="66" cy="26" r="6.5"/>
  <path fill-rule="evenodd" d="
    M50 22 a17 22 0 1 0 0.01 0 Z
    M43 40 a2.4 2.4 0 1 0 0.01 0 Z
    M57 40 a2.4 2.4 0 1 0 0.01 0 Z
    M42 58 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0"/>
  <ellipse cx="50" cy="55" rx="3.2" ry="3.4"/>
  <path d="M24 94 C28 80 37 74 50 74 C63 74 72 80 76 94 Z"/>
</g>
  </symbol>

  <symbol id="bear-spider" viewBox="0 0 100 100">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="31" cy="34" r="8"/>
  <circle cx="69" cy="34" r="8"/>
  <path fill-rule="evenodd" d="
    M50 31 A19 19 0 1 1 49.99 31 Z
    M42 47 a6.5 6.5 0 1 0 0.01 0 Z
    M58 47 a6.5 6.5 0 1 0 0.01 0 Z
    M42 63 a8 6.5 0 1 0 16 0 a8 6.5 0 1 0 -16 0"/>
  <circle cx="42" cy="47" r="2.6"/>
  <circle cx="58" cy="47" r="2.6"/>
  <ellipse cx="50" cy="60" rx="3.2" ry="2.6"/>
  <path d="M26 94 C30 80 39 74 50 74 C61 74 70 80 74 94 Z"/>
</g>
  </symbol>

  <symbol id="bear-grasshopper" viewBox="0 0 100 100">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="30" cy="34" r="8.5"/>
  <circle cx="70" cy="34" r="8.5"/>
  <path fill-rule="evenodd" d="
    M50 31 A18 18 0 1 1 49.99 31 Z
    M43 46 a2.5 2.5 0 1 0 0.01 0 Z
    M57 46 a2.5 2.5 0 1 0 0.01 0 Z
    M42 58 a8 6.5 0 1 0 16 0 a8 6.5 0 1 0 -16 0"/>
  <ellipse cx="50" cy="55" rx="3.2" ry="2.6"/>
  <!-- the iconic lolling tongue -->
  <path fill="none" stroke-width="5" d="M50 60 L50 71"/>
  <path fill-rule="evenodd" d="
    M24 94 C28 78 37 71 50 71 C63 71 72 78 76 94 Z
    M40 92 C40 79 60 79 60 92 Z"/>
</g>
  </symbol>

  <symbol id="bear-beetle" viewBox="0 0 100 100">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <ellipse cx="32" cy="28" rx="7.5" ry="9"/>
  <ellipse cx="68" cy="28" rx="7.5" ry="9"/>
  <path fill-rule="evenodd" d="
    M50 30 A17 17 0 1 1 49.99 30 Z
    M43 45 a2.5 2.5 0 1 0 0.01 0 Z
    M57 45 a2.5 2.5 0 1 0 0.01 0 Z
    M42 57 a7.5 6 0 1 0 15 0 a7.5 6 0 1 0 -15 0"/>
  <ellipse cx="50" cy="54" rx="3" ry="2.5"/>
  <rect x="14" y="72" width="72" height="7" rx="3.5"/>
  <circle cx="34" cy="72" r="6"/>
  <circle cx="66" cy="72" r="6"/>
  <path fill="none" stroke-width="4" d="M32 79 L32 88 M40 79 L40 87 M60 79 L60 87 M68 79 L68 88"/>
</g>
  </symbol>

  <symbol id="bear-mosquito" viewBox="0 0 100 100">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="29" cy="30" r="10"/>
  <circle cx="71" cy="30" r="10"/>
  <path fill-rule="evenodd" d="
    M50 32 A17 17 0 1 1 49.99 32 Z
    M43 47 a2.5 2.5 0 1 0 0.01 0 Z
    M57 47 a2.5 2.5 0 1 0 0.01 0 Z
    M42 59 a7.5 6 0 1 0 15 0 a7.5 6 0 1 0 -15 0"/>
  <ellipse cx="50" cy="56" rx="3" ry="2.5"/>
  <path fill-rule="evenodd" d="
    M25 94 C29 78 38 71 50 71 C62 71 71 78 75 94 Z
    M39 74 L50 88 L61 74 L55 74 L50 80 L45 74 Z"/>
</g>
  </symbol>

  <symbol id="bear-ladybug" viewBox="0 0 100 100">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="30" cy="31" r="9"/>
  <circle cx="70" cy="31" r="9"/>
  <circle cx="50" cy="49" r="19" fill="none" stroke-width="5"/>
  <ellipse cx="41" cy="46" rx="5" ry="7" transform="rotate(22 41 46)"/>
  <ellipse cx="59" cy="46" rx="5" ry="7" transform="rotate(-22 59 46)"/>
  <ellipse cx="50" cy="58" rx="3.4" ry="2.8"/>
  <path fill="none" stroke-width="5" d="M28 92 C32 80 40 75 50 75 C60 75 68 80 72 92"/>
</g>
  </symbol>

  <symbol id="bear-pillbug" viewBox="0 0 100 100">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <ellipse cx="32" cy="30" rx="6.5" ry="8"/>
  <ellipse cx="68" cy="30" rx="6.5" ry="8"/>
  <path fill-rule="evenodd" d="
    M50 30 A16 16 0 1 1 49.99 30 Z
    M43 42 a2.4 2.4 0 1 0 0.01 0 Z
    M57 42 a2.4 2.4 0 1 0 0.01 0 Z"/>
  <!-- shaggy jaw fur flanking the muzzle -->
  <path fill="none" stroke-width="3.5" d="M35 57 L30 66 M42 62 L39 72 M58 62 L61 72 M65 57 L70 66"/>
  <!-- long droopy muzzle extending down -->
  <path fill-rule="evenodd" d="
    M42 50 C42 46 58 46 58 50 L55 70 C55 76 45 76 45 70 Z
    M50 58 a3 3 0 1 0 0.01 0 Z"/>
  <path d="M24 94 C28 82 36 77 50 77 C64 77 72 82 76 94 Z"/>
  <!-- digging claws -->
  <path fill="none" stroke-width="4.5" d="M38 92 C35 84 36 80 40 77 M62 92 C65 84 64 80 60 77"/>
</g>
  </symbol>

  <symbol id="motif-crown" viewBox="0 0 100 100">
    <path
      d="M18 70 L14 34 L34 50 L50 26 L66 50 L86 34 L82 70 Z"
      fill="currentColor"
      stroke="currentColor"
      stroke-width="4"
      stroke-linejoin="round"
    />
  </symbol>

  <symbol id="motif-tile" viewBox="0 0 100 100">
    <polygon
      points="50,8 86.4,29 86.4,71 50,92 13.6,71 13.6,29"
      fill="none"
      stroke="currentColor"
      stroke-width="5"
      stroke-linejoin="round"
    />
    <circle cx="50" cy="50" r="14" fill="currentColor" />
  </symbol>
</svg>
