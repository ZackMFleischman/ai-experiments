<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- One asset source of truth (DESIGN §6.4). T6.1 glyph set: flat single-color
       marks, 100x100 grid, stroke=currentColor, consistent 6px weight, readable
       at 40px. Tile bases tint via the CSS var - -hive-tile. -->

  <symbol id="hex-base" viewBox="0 0 100 100">
    <polygon
      points="50,2 91.6,26 91.6,74 50,98 8.4,74 8.4,26"
      fill="var(--hive-tile, #f3e9d2)"
      stroke="var(--hive-tile-edge, #00000033)"
      stroke-width="3"
      stroke-linejoin="round"
    />
  </symbol>

  <symbol id="hex-ghost" viewBox="0 0 100 100">
    <polygon
      points="50,4 89.9,27 89.9,73 50,96 10.1,73 10.1,27"
      fill="var(--hive-ghost-fill, transparent)"
      stroke="currentColor"
      stroke-width="4"
      stroke-dasharray="9 7"
      stroke-linejoin="round"
    />
  </symbol>

  <symbol id="bug-queen" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- crown -->
      <path d="M36 22 L40 10 L47 19 L50 6 L53 19 L60 10 L64 22 Z" fill="currentColor" stroke-width="3" />
      <!-- head + thorax -->
      <circle cx="50" cy="33" r="9" />
      <!-- wings -->
      <path d="M40 50 C22 42 16 52 30 62" />
      <path d="M60 50 C78 42 84 52 70 62" />
      <!-- striped abdomen -->
      <path d="M50 44 C62 44 68 54 68 65 C68 79 60 90 50 90 C40 90 32 79 32 65 C32 54 38 44 50 44 Z" />
      <path d="M33 58 L67 58 M32 70 L68 70 M37 81 L63 81" stroke-width="5" />
    </g>
  </symbol>

  <symbol id="bug-ant" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="50" cy="24" r="10" />
      <ellipse cx="50" cy="48" rx="8" ry="10" />
      <ellipse cx="50" cy="76" rx="13" ry="15" />
      <!-- jointed legs -->
      <path d="M43 42 L28 32 L20 20 M42 51 L24 51 L14 46 M44 60 L30 68 L26 80" />
      <path d="M57 42 L72 32 L80 20 M58 51 L76 51 L86 46 M56 60 L70 68 L74 80" />
      <!-- curled antennae -->
      <path d="M44 16 C40 8 34 6 30 10 M56 16 C60 8 66 6 70 10" />
    </g>
  </symbol>

  <symbol id="bug-spider" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="50" cy="40" r="10" />
      <ellipse cx="50" cy="66" rx="13" ry="16" />
      <!-- four jointed legs per side -->
      <path d="M41 34 L28 20 L24 10 M40 44 L20 36 L10 36 M41 54 L22 56 L12 64 M45 62 L32 74 L30 86" />
      <path d="M59 34 L72 20 L76 10 M60 44 L80 36 L90 36 M59 54 L78 56 L88 64 M55 62 L68 74 L70 86" />
    </g>
  </symbol>

  <symbol id="bug-grasshopper" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- angled body, mid-leap -->
      <ellipse cx="48" cy="48" rx="13" ry="28" transform="rotate(14 48 48)" />
      <circle cx="41" cy="15" r="8" />
      <path d="M37 8 L30 2 M47 9 L52 2" stroke-width="4" />
      <!-- the big jumping leg -->
      <path d="M58 36 L84 44 L78 70 L88 88" />
      <!-- front legs -->
      <path d="M36 42 L22 50 L18 60 M38 56 L26 68 L26 78" />
    </g>
  </symbol>

  <symbol id="bug-beetle" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- split elytra -->
      <path d="M50 34 C66 34 72 46 72 60 C72 76 62 88 50 88 C38 88 28 76 28 60 C28 46 34 34 50 34 Z" />
      <path d="M50 36 L50 86" stroke-width="5" />
      <!-- leg stubs -->
      <path d="M29 50 L16 44 M27 64 L14 64 M32 76 L20 84" stroke-width="5" />
      <path d="M71 50 L84 44 M73 64 L86 64 M68 76 L80 84" stroke-width="5" />
      <!-- head + pincers -->
      <circle cx="50" cy="23" r="8" />
      <path d="M44 16 C38 6 30 4 26 8 M56 16 C62 6 70 4 74 8" stroke-width="5" />
    </g>
  </symbol>

  <symbol id="bug-mosquito" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <!-- proboscis -->
      <path d="M50 26 L50 6" />
      <circle cx="50" cy="33" r="7" />
      <!-- slim body -->
      <path d="M50 40 L50 66 M47 66 C47 76 50 84 50 84 C50 84 53 76 53 66 Z" stroke-width="6" />
      <!-- swept wings -->
      <ellipse cx="32" cy="56" rx="8" ry="21" transform="rotate(26 32 56)" />
      <ellipse cx="68" cy="56" rx="8" ry="21" transform="rotate(-26 68 56)" />
      <!-- trailing legs -->
      <path d="M45 44 L30 34 M55 44 L70 34" stroke-width="4" />
    </g>
  </symbol>

  <symbol id="bug-ladybug" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round">
      <circle cx="50" cy="58" r="26" />
      <path d="M50 32 L50 84" stroke-width="5" />
      <path d="M40 26 C42 20 46 17 50 17 C54 17 58 20 60 26" />
      <path d="M44 18 L38 8 M56 18 L62 8" stroke-width="4" />
      <circle cx="38" cy="50" r="4.5" fill="currentColor" stroke="none" />
      <circle cx="62" cy="50" r="4.5" fill="currentColor" stroke="none" />
      <circle cx="36" cy="66" r="4.5" fill="currentColor" stroke="none" />
      <circle cx="64" cy="66" r="4.5" fill="currentColor" stroke="none" />
      <circle cx="50" cy="72" r="4.5" fill="currentColor" stroke="none" />
    </g>
  </symbol>

  <symbol id="bug-pillbug" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- segmented dome -->
      <path d="M22 68 A28 28 0 1 1 78 68 Z" />
      <path d="M26 46 L74 46 M23 57 L77 57" stroke-width="5" />
      <!-- little legs under the shell -->
      <path d="M30 68 L28 80 M40 68 L39 82 M50 68 L50 83 M60 68 L61 82 M70 68 L72 80" stroke-width="4" />
      <!-- antennae -->
      <path d="M36 30 L28 20 M64 30 L72 20" stroke-width="4" />
    </g>
  </symbol>

  <!-- Bear-mode glyph set: same mark system, one bear species per piece.
       Field marks keep them apart at 40px: crown (brown/queen), long clean
       face (polar), eye rings (spectacled), chest blaze + tongue (sun),
       branch pose (black), big ears + chest V (moon), solid patches (panda),
       shaggy jaw + claws (sloth). -->

  <symbol id="bear-queen" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- crown (queen identity marker, shared with the bug set) -->
      <path d="M34 24 L38 8 L46 17 L50 3 L54 17 L62 8 L66 24 Z" fill="currentColor" stroke-width="3"/>
      <circle cx="34" cy="39" r="7.5"/>
      <circle cx="66" cy="39" r="7.5"/>
      <circle cx="50" cy="55" r="18"/>
      <ellipse cx="50" cy="63" rx="8.5" ry="7"/>
      <circle cx="50" cy="60" r="3" fill="currentColor" stroke="none"/>
      <circle cx="42" cy="50" r="2.7" fill="currentColor" stroke="none"/>
      <circle cx="58" cy="50" r="2.7" fill="currentColor" stroke="none"/>
      <!-- burly shoulders -->
      <path d="M26 94 C30 82 38 77 50 77 C62 77 70 82 74 94"/>
    </g>
  </symbol>

  <symbol id="bear-ant" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- tiny far-set ears, long clean face: the white bear needs no marks -->
      <circle cx="39" cy="26" r="4.2"/>
      <circle cx="61" cy="26" r="4.2"/>
      <ellipse cx="50" cy="50" rx="16" ry="24"/>
      <circle cx="50" cy="70" r="3.6" fill="currentColor" stroke="none"/>
      <circle cx="43.5" cy="42" r="2.6" fill="currentColor" stroke="none"/>
      <circle cx="56.5" cy="42" r="2.6" fill="currentColor" stroke="none"/>
      <path d="M22 94 C28 84 36 80 50 80 C64 80 72 84 78 94"/>
    </g>
  </symbol>

  <symbol id="bear-spider" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="35" cy="31" r="7"/>
      <circle cx="65" cy="31" r="7"/>
      <circle cx="50" cy="49" r="18"/>
      <!-- the spectacles -->
      <circle cx="41.5" cy="45" r="7" stroke-width="5.5"/>
      <circle cx="58.5" cy="45" r="7" stroke-width="5.5"/>
      <path d="M48.5 45 L51.5 45" stroke-width="4"/>
      <circle cx="41.5" cy="45" r="2.2" fill="currentColor" stroke="none"/>
      <circle cx="58.5" cy="45" r="2.2" fill="currentColor" stroke="none"/>
      <ellipse cx="50" cy="60" rx="6.5" ry="5"/>
      <circle cx="50" cy="57.5" r="2.8" fill="currentColor" stroke="none"/>
      <path d="M30 94 C34 84 41 80 50 80 C59 80 66 84 70 94"/>
    </g>
  </symbol>

  <symbol id="bear-grasshopper" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="40" cy="22" r="4.2"/>
      <circle cx="60" cy="22" r="4.2"/>
      <circle cx="50" cy="34" r="13.5"/>
      <ellipse cx="50" cy="41" rx="6.5" ry="5"/>
      <circle cx="50" cy="38.5" r="2.7" fill="currentColor" stroke="none"/>
      <circle cx="44.5" cy="30" r="2.4" fill="currentColor" stroke="none"/>
      <circle cx="55.5" cy="30" r="2.4" fill="currentColor" stroke="none"/>
      <!-- the famous tongue -->
      <path d="M50 46 C50 56 45 58 43 61" stroke-width="5"/>
      <!-- bust with the sunrise chest blaze -->
      <path d="M26 94 C28 72 37 63 50 63 C63 63 72 72 74 94"/>
      <path d="M40 90 C40 76 60 76 60 90"/>
    </g>
  </symbol>

  <symbol id="bear-beetle" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- tall upright ears -->
      <circle cx="34" cy="25" r="8.5"/>
      <circle cx="66" cy="25" r="8.5"/>
      <circle cx="50" cy="44" r="16.5"/>
      <ellipse cx="50" cy="52" rx="7" ry="5.5"/>
      <circle cx="50" cy="49.5" r="3" fill="currentColor" stroke="none"/>
      <circle cx="42.5" cy="40" r="2.7" fill="currentColor" stroke="none"/>
      <circle cx="57.5" cy="40" r="2.7" fill="currentColor" stroke="none"/>
      <!-- the climber: paws over a branch -->
      <path d="M18 76 L82 72" stroke-width="6"/>
      <circle cx="38" cy="70" r="5.5" fill="currentColor" stroke="none"/>
      <circle cx="62" cy="69" r="5.5" fill="currentColor" stroke="none"/>
      <path d="M36 76 L36 84 M42 76 L42 83 M60 75 L60 83 M66 74 L66 82" stroke-width="4"/>
    </g>
  </symbol>

  <symbol id="bear-mosquito" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- oversized round ears -->
      <circle cx="32" cy="28" r="9.5"/>
      <circle cx="68" cy="28" r="9.5"/>
      <circle cx="50" cy="46" r="15.5"/>
      <ellipse cx="50" cy="54" rx="6.5" ry="5"/>
      <circle cx="50" cy="51.5" r="2.8" fill="currentColor" stroke="none"/>
      <circle cx="43.5" cy="42" r="2.5" fill="currentColor" stroke="none"/>
      <circle cx="56.5" cy="42" r="2.5" fill="currentColor" stroke="none"/>
      <!-- bust with the crescent-moon chest V -->
      <path d="M28 94 C30 74 38 66 50 66 C62 66 70 74 72 94"/>
      <path d="M41 76 L50 87 L59 76" stroke-width="6.5"/>
    </g>
  </symbol>

  <symbol id="bear-ladybug" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- solid ear + eye patches -->
      <circle cx="33" cy="31" r="8.5" fill="currentColor" stroke="none"/>
      <circle cx="67" cy="31" r="8.5" fill="currentColor" stroke="none"/>
      <circle cx="50" cy="50" r="19"/>
      <ellipse cx="41.5" cy="47" rx="5" ry="7.5" transform="rotate(20 41.5 47)" fill="currentColor" stroke="none"/>
      <ellipse cx="58.5" cy="47" rx="5" ry="7.5" transform="rotate(-20 58.5 47)" fill="currentColor" stroke="none"/>
      <circle cx="50" cy="58" r="3.2" fill="currentColor" stroke="none"/>
      <path d="M50 61 C50 64.5 46.5 66 45 65" stroke-width="4"/>
      <path d="M32 94 C34 82 41 76 50 76 C59 76 66 82 68 94"/>
    </g>
  </symbol>

  <symbol id="bear-pillbug" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- floppy ears + shaggy jaw fur -->
      <circle cx="36" cy="27" r="6"/>
      <circle cx="64" cy="27" r="6"/>
      <circle cx="50" cy="42" r="15"/>
      <path d="M39 53 L33 63 M46 56 L44 66 M54 56 L56 66 M61 53 L67 63" stroke-width="4"/>
      <!-- long droopy muzzle -->
      <ellipse cx="50" cy="52" rx="7" ry="8"/>
      <circle cx="50" cy="57" r="3.2" fill="currentColor" stroke="none"/>
      <circle cx="43.5" cy="37" r="2.5" fill="currentColor" stroke="none"/>
      <circle cx="56.5" cy="37" r="2.5" fill="currentColor" stroke="none"/>
      <!-- the rock-flipping claws -->
      <path d="M38 74 C35 83 36 89 41 94 M50 76 C48 84 49 90 53 95 M62 74 C65 83 64 89 59 94" stroke-width="5.5"/>
    </g>
  </symbol>

  <symbol id="motif-crown" viewBox="0 0 100 100">
    <path
      d="M18 70 L14 34 L34 50 L50 26 L66 50 L86 34 L82 70 Z"
      fill="currentColor"
      stroke="currentColor"
      stroke-width="4"
      stroke-linejoin="round"
    />
  </symbol>

  <symbol id="motif-tile" viewBox="0 0 100 100">
    <polygon
      points="50,8 86.4,29 86.4,71 50,92 13.6,71 13.6,29"
      fill="none"
      stroke="currentColor"
      stroke-width="5"
      stroke-linejoin="round"
    />
    <circle cx="50" cy="50" r="14" fill="currentColor" />
  </symbol>
</svg>
